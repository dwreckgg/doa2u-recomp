name: Release

# On the netplay branch every push is built and published as a GitHub
# pre-release tagged netplay-v<major>.<minor>.<run>: both online players
# download the same DOA2U.exe (the online build check compares the compiled
# code, so two self-built exes from different compilers never match), and
# Check for Updates in the game fetches the newest one. Pre-releases are not
# returned by /releases/latest, so the main builds' updater does not see them.
# A manual run on any other branch publishes a main release v<major>.<minor>.<run>.
on:
  push:
    branches: [netplay]
    # what the online build id covers (the doa2u/ tree and the compiled code):
    # a docs-only push publishes nothing
    paths: ['doa2u/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # forks do not publish unless they opt in (repository variable PUBLISH_RELEASES = true)
    if: github.repository == 'parkerallan/doa2u-recomp' || vars.PUBLISH_RELEASES == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5   # Node 24 (v4 runs on the deprecated Node 20)
        with:
          persist-credentials: false   # the build steps never see the write token

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw doa2u/CMakeLists.txt
          $m = [regex]::Match($text, 'project\(doa2u_recomp\s+VERSION\s+([0-9]+\.[0-9]+)')
          if (-not $m.Success) {
              throw "Could not parse VERSION out of project(doa2u_recomp ...) in doa2u/CMakeLists.txt"
          }
          $channel = if ($env:GITHUB_REF_NAME -eq 'netplay') { 'netplay' } else { '' }
          $version = "$($m.Groups[1].Value).$env:GITHUB_RUN_NUMBER"
          $tag = if ($channel) { "$channel-v$version" } else { "v$version" }
          Write-Host "channel: '$channel'  tag: $tag"
          "channel=$channel"              | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"                      | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=DOA2U-$tag-win64.zip"      | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S doa2u -B doa2u/build -A x64 `
                -DDOA2U_BUILD_NUMBER="$env:GITHUB_RUN_NUMBER" `
                -DDOA2U_RELEASE_CHANNEL="${{ steps.version.outputs.channel }}" `
                -DDOA2U_RELEASE_REPO="$env:GITHUB_REPOSITORY"

      # The generated recomp sources (26 files, ~55 MB of C) are code-generated by
      # one cl process per batch, and its memory grows across the batch: runs on the
      # 16 GB runner failed with C1002 "compiler is out of heap space in pass 2"
      # (2026-10-29), with projects in parallel and alone. A 16-32 GB page file
      # (vendored script, see its header) gives it room; one project at a time
      # keeps only one such process running.
      - name: Page file
        shell: pwsh
        run: |
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, Used, Free -AutoSize
          ./.github/scripts/SetPageFileSize.ps1 -MinimumSize 16GB -MaximumSize 32GB -DiskRoot "D:"

      - name: Build
        shell: pwsh
        run: cmake --build doa2u/build --config Release --target doa2u release_channel_test join_code_test netplay_format_test -- /m:1

      - name: Host tests
        shell: pwsh
        run: |
          $failed = 0
          foreach ($t in 'release_channel_test', 'join_code_test', 'netplay_format_test') {
              & "doa2u/build/tests/Release/$t.exe"
              if ($LASTEXITCODE -ne 0) { Write-Host "$t failed ($LASTEXITCODE)"; $failed++ }
          }
          if ($failed) { throw "$failed host test(s) failed" }

      - name: Stage and zip
        shell: pwsh
        run: |
          $stage = "staging"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory $stage | Out-Null

          $exe = "doa2u/build/release/DOA2U.exe"
          if (-not (Test-Path $exe)) {
              throw "DOA2U.exe is missing from doa2u/build/release -- refusing to publish an empty archive"
          }
          # Only the exe ships. assets/ (the extracted game), the ini files and
          # the logs are all created beside it on the player's machine.
          Copy-Item $exe $stage

          # Never publish game data: fail if anything other than the exe got staged.
          $extra = Get-ChildItem $stage -Recurse | Where-Object { $_.Name -ne 'DOA2U.exe' }
          if ($extra) {
              throw "Unexpected files staged: $($extra.Name -join ', ')"
          }

          Write-Host "--- archive contents ---"
          Get-ChildItem $stage -Recurse -File | ForEach-Object { "$($_.Name)  $($_.Length) bytes" }

          Compress-Archive -Path (Join-Path $stage '*') `
                           -DestinationPath "${{ steps.version.outputs.zip }}" -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if ("${{ steps.version.outputs.channel }}") {
              $notes = "Online play build from the netplay branch (commit $env:GITHUB_SHA).`n`n" +
                       "Both players need this same release. Put DOA2U.exe from the zip in your game folder " +
                       "(next to assets), or press Check for Updates in the game's Online tab. " +
                       "No game data is included."
              gh release create $tag "${{ steps.version.outputs.zip }}" `
                  --title "DOA2U netplay $tag" `
                  --target "$env:GITHUB_SHA" `
                  --prerelease `
                  --notes $notes
          } else {
              gh release create $tag "${{ steps.version.outputs.zip }}" `
                  --title "DOA2U $tag" `
                  --target "$env:GITHUB_SHA" `
                  --generate-notes
          }
